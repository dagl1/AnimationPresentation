id: ptr_missingness

type: graph_plot

title: "PTR vs missing tissues"

purpose: >
  Show negative correlation between PTR and number of tissues where protein is missing.

axes:
  x:
    label: "Missing tissues"
    type: linear
    range: [0, 29]
  y:
    label: "PTR (log10)"
    range: [3.5, 4.5]

elements:
  - type: boxplot
    id: boxplots
    description: PTR distributions per missing count

  - type: line
    id: regression
    description: negative trend

data:
  synthetic: true
  description: >
    Boxplots decrease gradually from ~4.5 to ~3.5

animations:
  - step: 1
    action: draw_boxplots
  - step: 2
    action: draw_line
    target: regression

highlights:
  - type: region
    description: emphasize downward trend

notes: >
  Leave space for 29th point (missing completely).