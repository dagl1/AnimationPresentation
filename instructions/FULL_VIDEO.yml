


## Scene 1 How can we integrate gene expression into metabolic models to predict a patient's
##  metabolic state?
## Story: how can we tell the metabolic state inside tissue, for instance from a biopsy?
## In metabolic modeling this is done through integrating gene expression data into genome-scale metabolic models,
## and there are many methods to do this, for instance we can set some threshold for highly expressed and lowly
## then attempt to include as many highly expressed reactions as possible, while excluding lowly expressed reactions, this is the idea behind iMAT (Shlomi et al. 2008).
## Of cousre this is still a metabolic network and thus we cannot just remove all low expression reactions, we have
#  to keep paths.
## Alternatively we can compare values of gene expression between samples, calculate the log2 fold change,
# and set the upper and lower bounds of reactions based on the fold change, this is the idea behind eFlux (Colijn et al. 2009).
## All these methods rely on one key intuition: if a gene is highly expressed, then the reaction it catalyzes is likely to be active, and if a gene is lowly expressed, then the reaction it catalyzes is likely to be inactive.
## If we compare samples, higher gene expression in one sample compared to another, indicates higher activity of the reaction it catalyzes,
## For instance if we have a sample whose reaction have some expression (20, 20), and antoher
## pathway with higher expression (200, 200), then we can infer that the second pathway is more active than the
## first pathway. One might wonder if this intuition is correct, but at least in its most extreme case
## where we see that a gene is not expressed at all, we can say that any sample that does have this
## gene expressed must have more capability than when there is no gene at all.
## Of course this all relies on ways to assign gene expression to reactions, and this is where GPR rules come in

