## Scene 2 GPR rules
# Gene Protein Reaction (GPR) rules are a key component of metabolic models, and they describe how genes are related to the reactions they catalyze.
# Story: how do we assign gene expression to reactions? This is done through GPR rules, which are boolean expressions that describe how genes are related to the reactions they catalyze.
# To illustrate this, let's look at a toy network with 3 reactions and 4 genes (A, B, C, D).
# A reaction can be catalyzed by a single gene, for instance if we have a reaction that is catalyzed by gene A, then the GPR rule for that reaction would be simply "A".
# However, if we have a reaction that is catalyzed by two genes, for instance if we have a reaction that is catalyzed
#by a complex of two proteins, then the GPR rule for that reaction would be "A AND B", which means that both gene A and gene B need to be expressed for the reaction to be active.
# Alternatively, if we have a reaction that can be catalyzed by either gene C or gene D, then the GPR rule for that reaction would be "C OR D", which means
#that either gene C or gene D needs to be expressed for the reaction to be active.
# Finally, we can have a combination of AND and OR, for instance if we have a reaction that is catalyzed by a complex of two proteins, but either of those proteins can be replaced by another protein, then
# for instance (A or B) AND (C or D), which means that we have 4 functioning combinations, A and C, A and D, B and C, B and D, any of which would be sufficient for the reaction to be active.
# To integrate gene expression into metabolic models, methods use these GPR rules, but 
# more importantly they rely on the same intuition that if a gene is highly expressed, then the reaction it catalyzes is likely to be active, and if a gene is lowly expressed, then the reaction it catalyzes is likely to be inactive.
# However gene expression isn't the same as enzymatic capacity, and the process to do so (implicitly) relies on three main steps
# 1. Finding how much protein exists (this is often skipped when using gene expression, otherwise proteomics data can
#be used, but this is often not available)
# 2. Assigning gene expression to reactions using GPR rules
# 3. Setting enzyme_specific catalytic kcat values, as each enzyme might have its own speed at which it catalyzes the reaction
# GPRimproved is a python-based implementation for integrating gene expression into metabolic models which tackles 
# three steps.
# In summary, GPRimpvoed first uses species and tissue-specific protein-to-RNA datasets,
# to convert gene expression to protein abundance. It then uses a novel allocation strategy
# that takes into account total enzyme abundance when allocating multimeric enzyme complexes,
# while being independent of model objectives, something which we will see come up later
# Last, each allocated enzyme or enzyme complex is given its reaction-specific catalytic kcat value, which is important as different enzymes can have different speeds at which they catalyze reactions, and this can be important for accurate predictions of metabolic states.

