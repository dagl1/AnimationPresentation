# Scene 6 Step 3: Setting enzyme-specific catalytic kcat values
# Story: The last step in integrating gene expression into metabolic models is setting enzyme-specific catalytic kcat values,
# as each enzyme might have its own speed at which it catalyzes the reaction, and this can be important for accurate predictions of metabolic states.
# these are often obtained from databases such as BRENDA, and or predicted from protein sequence and SMILES
# metabolite representation. GPRimproved uses predictions through UniKP, which is a machine learning model that takes
#  as input the protein sequence and the SMILES representation of the substrate.
# GPRimproved is designed in a modular way, and thus one can use other things than UniKP.
# In the end we must get a per-gene or per-IFC kcat value for each reaction.
# GPRimproved does this by first predicting each gene-substrate kcat.
# then, for each gene in every reaction, what the maximum substrate kcat is and uses this for that gene in that reaction
# We do this because often water and other cosubstrates are not trained on, and will get low kcat values.
# therefore we take the highest kcat value across the substrates for a gene.
# Not all models will have SMILES for all substrates, and thus we have to impute their values.
# GPRimproved does this by taking the median kcat value of all substrates in the same cellular
# compartment (show graph per compartment values and how they differ, all between 1.2 and 1.6 in log10),
# but lysosome and mitochondria deviate
# Then for each IFC, it takes the maximum kcat of the genes in the IFC.
# While it feels intuitive to take the rate limiting step in an AND-linking rule, which is
# what an IFC is, this turns out to not be the case when we consider an enzyme complex
# AB and AC. Here likely B or C are catalytic subunits, while A is acting as a scaffold.
# it does not have a catalytic subunit and so should be predicted tohave a low kcat
# thus we take the maximum kcat of the genes in the IFC, which allows us to ignore non-catalytic subunits.
# As we have a per-reaction set of IFCs, each a functioning complex, we then assign their
# reaction specific kcats and multiply their allocated abundance by this value.
# then these values are subsequently summed up to get the total enzymatic capacity of each reaction.
# With this GPRimproved succesfully integrated gene expression into metabolic models,
# and we can use this to predict metabolic states of patients.
