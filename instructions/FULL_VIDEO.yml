  ### Scene 5 step 2.2: GPRimproved's novel allocation strategy for multimeric enzyme complexes, while ignoring non-catalytic subunits
  # Story: Instead GPRimproved uses a novel allocation strategy that takes into account total enzyme abundance when 
  #  allocating
  #  multimeric enzyme complexes, while being independent of model objectives. This is im
  # How does this work? First we take all GPRs of all reactions, and identify any gene or combination of genes
  # that can catalyze at least 1 reaction. Let's call these independently functioning complexes IFCs
  #  Some of these might be part of multiple reactions, others might work together,
  # while yet other genes just form a complex all on their own.
  # Each IFC would have a maximum abundance which is the minimum of its consitutent genes.
  # GPRimproved then utilises a QP (quadratic programming) problem that attempts to allocate
  # the avialble constituents of all IFCs such that the squared deviation from the maximum abundance of each IFC is minimized
  # while ensuring no gene is allocated more than its abundance.
  # In our previous example, both AE and AB receive 2.5 of A, and thus both are active.
  # this allocation strategy is independent of model objectives, and instead follows the intuition
  # that if a cell has one or more subunits expressed for a complex, then subsequently
  # under regular affinities we would find at least some of that complex present.
  # GPRimproved adds one optional feature called "gene trimming" which is designed to reduce the 
  # disastrous effect of false AND-linked genes. While a wrong OR-linked gene can lead to overestimation
  # of enzymatic capacity, generally increasing capacity in rate-limited or stoichiometrically constrained reactions
    # is not as bad as setting the capacity of a multienzyme complex to zero or a very low number,
  # as a result of a false AND-linked gene.
  # Gene trimming works by first identifying stable genes in the gene exrpession dataset,
  # and catagorising these as trimmable candidates. In each IFC, before calcualting the QP
  # if an IFC contains enough members, let's say 8, and the lowest abundance one is trimmable,
  # for the QPs calcualtion this gene does not count. This process is repated iteratively until the 
    # lowest abundance gene is not trimmable, or there are not enough members to trim anymore (thus less than 8).
  # While this does lead to some overestimation of enzymatic capacity in reactions that should not have been trimmed.
  # it  is likely that complex constituentst that should not be trimmed will likely be closer to their peers, than
  # constituents that should be trimmed ( 10, 11, 12, 13, 14, 15, 16, 17). trimming 10 means a slight overestimation,
  # after calculating the min() but if instead the 10 is the same but all values increase 100fold, then the 10
  # is more likely to be a false AND-linked gene. Of course it is possible the 10 is a real condition-specific effect,
  # which is why only genes that are stable across the dataset are catagorised as trimmable candidates,
  # if some samples show high values for the 10, while others show low values, then it is likely that this is a real effect and thus not trimmable.
  # After solving the QP problem, we go back to reactions and can assign the allocated abundance of the IFCs to the
  #  reactions they catalyze. In GPRimproved, this is only done after incorperating the kcats.
-- show the process of identifying IFCs from all GPRs, and show how some of these might be part of multiple reactions, 
-- others might work together, while yet other genes just form a complex all on their own
-- show the QP problem, and how it allocates the available constituents of all IFCs such that the squared deviation from the maximum abundance of each IFC is minimized while ensuring no gene is allocated
$$
\begin{align}
&  max_i = \min_{p \in \mathcal{I}_{FP,i}} e_p   
\quad &&&& \forall i \in \mathcal{I}_{FP} \\[8pt]
\text{QP:} \quad 
\min_{a_i,\,e_p} \quad 
& \sum_{i \in \mathcal{I}_{FP}} \left( 1 - \frac{a_i}{max_i} \right)^2 \\[6pt]
\text{s.t.} \quad
& e_p \ge \sum_{i :\, p \in \mathcal{I}_{FP,i}} a_i 
\quad &&&& \forall i \in \mathcal{I}_{FP} \\[4pt]
& e_p \ge 0 
\quad &&&& \forall p \in \mathcal{P}
\end{align}
$$
