## Scene 3 Step 1: Finding how much protein exists
# Story: While an increase in gene expression is often associated with an increase in protein abundance,
# the amount of protein per RNA (PTR) is gene specific, and thus we can see in the toy_example that
# if we want to say something about (A5, B10) and (A10, B5) that without other knowledge these are the same
# if we know however that the PTR of gene A is 10, while the PTR of gene B is 1,
# then in reality we do have clear differences as we it becomes (A50, B10) and (A100, B5),
# the PTR of a gene is dependent on many factors, first of is the RNA itself, it has a half-life,
# with shorter half lifes leading to lower overall steady-steate RNA levels.
# Coupled to this is translational efficiency: how many ribosomes or proteins are created from each RNA.
# On the protein side we then also have protein half-life, and together these will lead to the PTR of the protein.
# For instance, when performing RNA-seq of a short half-life RNA we will at any moment only see a few RNA molecules,
# but if the translational efficiency is high, and the protein half-life is long, then we can have a lot of protein from just a few RNA molecules, leading to a high PTR.
# While some of these factors are of course condition-specific, a recent paper showed that with just sequence features,
# over 40% of the variance in PTR can be explained (show graph). Similarly, we see that genes in these datasets
# behave much more similar to themselves across tissues than to other genes in the tissue.
# GPRimproved uses a species and tissue-specific PTR dataset to convert gene expression to protein abundance.
# Several species-specific datasets have been identified, and these are processed as follows:
# First we select only the genes that are present in the metabolic model, and remove the rest.
# not all genes in the metabolic model will be present in the PTR dataset, and some genes
# in the dataset mighnt not have values in all of the columns (tissues) of the dataset.
# first the median of each tissue is calculated, and the ratio of all of these to their median is calculated
# then genes present at least once in the dataset are imputed by taking the median of all of their values across tissues
# and adjusting it for the median of the tissue in which it is being imputed. If a tissue overall has higher PTR values, then the imputed value will be higher, and if a tissue overall has lower PTR values, then the imputed value will be lower.
# Following this there are still some genes that are not present in the dataset, and to impute these
# we first recalcualte the median of each tissue, and use that median to impute the remaining genes.
# why would we recalcualte the median? This has to do with a common limitation in proteomics.
# The minimum abundance necessary to identify signal is often quite high, for instance in this graph in log2,
# we see the horizontal line at 9. Any values below this value would not be picked up, and so when we see a "misisng"
# value that could be anywhere between 0 and 9. When we plot PTRs of idnetified proteins on the y axis,
# and on the x axis we plot the number of tissues in which the protein is missing,
# we see a negative correlation ; values hvoering around 9 in several tissues, might be missing in some.
# thus when we initailly imputed the genes based on some of the identified values, we expect these to be lower
# genes that are then entirely missing would then fall at the end of that negative correlation.
# of course we don't know if they are just below 9 or much lower, so we take recalcualted tissue median instead
# with this PTR data  is prepared and covers all metabolic genes in the model,
# and by multiplying each gene's expression by its PTR, we can convert gene expression to protein abundance.
