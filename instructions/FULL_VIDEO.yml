# Scene 4 Step 2: Assigning gene expression to reactions using GPR rules
# Story: Now that we have protein abundance, we need to assign it to reactions using GPR rules.
# We already discussed how GPR rules work, and a simple way to do this is to take the minimum of the genes in an AND-linking
# and the sum of the genes in an OR-linking. For instance in the following two reaction toy example,
# gene A and gene B are in an AND-linking, so we take the minimum of their values (show 5 A and 10 Bs floating, make
#  them attach and leave 5 of the b's without a partner
# for the second reaction, gene C and gene D are in an OR-linking, so we take the sum of their values,
# as both C and D can function independently.
# This works fine here, however what happens when we introduce another toy example, vertical in this case
# where gene A is also used together with a gene E in an AND-linking. If there is also 10 E,
# we would thus say that there is 5AB and 5AE, but we started out saying that in total there isonly 5 A
# A set of models called ecGEMS (enzyme-constrained genome-scale metabolic models) have been developed to tackle this problem
# and do so by making reactions use up their enzyme's abundance, and so in total no over allocation can occur
# however this requires users to define an objective function. Let's say that we want to maximize something
# that is downstream of the horizontal path, but not the vertical one. The ecGEMS would then allocate all of the A to
#  the horizontal path (AB) and none to the vertical path (AE), even though we know that both paths are active, and thus this is not ideal.
# These models also utilse catayltic activity values, which are step three of the process of integrating gene
#  expression into metabolic models. Even if both paths could lead to the maximization of the objective,
# the ecGEM would choose whichever reaction (AB or AE) has the higher catalytic activity, and ignore the other one.
# What if the objective is something that is not downstream of either path, or we don't even know the objective?
