Color mapping (global)
  Genes = Letters white
  Proteins = 3 different shapes, with green, blue, orange colors, rectangle with 2 bumps, single larger rectangle 
  that can fit in it, triangles (differen types of oranges), the rectangle shapes can form together
  Reactions = lines connecting nodes, with arrows, thickness variable 
  metabolties = white nodes
  High expression = up arrow and orange
  Low expression =  down arrow and purple
  Highlight/emphasis = yellow glow or outline
Shapes
  Genes → letters (A, B, C)
  Reactions → lines with arrows, thickness variable based on flux/activity
  Complexes (AND) → A + B stuck together,
  OR → just next to each other 

IFC identification:
  - comes from a table of reactions ( 10 long) with different forms of booleans, some single gene, some OR-linked,
  - some AND-linked some duplicates
  - take out all GPRS, remove duplicates, boil down to only AND linked
  - so (a or b) and (c or d) becomes ac, ad, bc, bd
  - these are IFCs

