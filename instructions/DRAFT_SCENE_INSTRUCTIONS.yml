subgraphs:
  -- PTR explained 40% (categorical x-axis, RNA sequence features, and y-axis is R2)
  -- Proteomics detection limit graph (Y-axis is log2, no real x axis, just point cloud with a line for detection 
  limit at 9), should be able to highlight whole area below 9,
  -- RNA halflife steady state graph (time on x-axis, concentration % on y-axis,
     with 3 lines, old rna, new rna, and total rna, half life indication and turn over where graphs meet)
     total rna is steady at 100%, 
  -- RNA turnover graph following a partial differential equation, with time on x-axis and concentration on y-axis,
     important to show formula with its components, and then show how changing the parameters changes the graph (e.g. increase transcription rate, increase degradation rate, etc)
  -- protein steady state turnover graph similar to RNA turnover graph,
  -- PTR vs missing tissue graph, amount missing tissues 0 to 28 (+ space for 29th) on x-axis, PTR on y-axis,
     PTR boxplots for each amount of missing tissues, starting around 4.5 log10 and going down to 3.5 log10, 
      with a regression line through it. boxplots should be about as big as 0.5 on the y axis
  -- Kcat per substrate graph in different compartments, x axis as cellular compartments (c, m, l etc), 
      y axis from 0.8 to 2.1 log 10, most values around 1.5 with ranges going +- 0.3, lysosome and mitochondria are 
      at 1.8~

